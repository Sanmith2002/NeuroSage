# Phase 3: training and evaluation harness.
# Scientific rules live in docs/phase1_final_decisions_v1.md, docs/selection_protocol.md
# and targets/*.yaml. Changing this file changes the configuration hash, so earlier
# runs in experiments/registry.csv are no longer reused.
version: 1
# Version of the model pipelines. 2 = every pipeline starts with DropDegenerateColumns (fold-safe removal of columns
# with < 2 distinct non-missing values). Changing it changes the configuration hash, so runs made with another
# pipeline are never reused.
pipeline_version: 2
seed: 20261011
n_jobs: -1
# Outer folds trained at the same time, in separate processes that share the cores. On the development
# laptop this roughly halves the time of the boosting models and does not help the random forest.
outer_jobs: {lr_l2: 5, lr_enet: 5, rf: 1, xgb: 5, hgb: 5}

labels: [pd_type_v1, ad_like_v1, vascular_v1]
main_tier: primary          # `cv` runs on this tier only
robustness_tier: strict

baselines: [b0a, b0b]
baseline_columns: [age, SEX]        # B0b: logistic regression on age + sex only
candidates: [lr_l2, lr_enet, rf, xgb, hgb]

tuning:
  inner_folds: 3
  trials: {lr_l2: 15, lr_enet: 15, rf: 25, xgb: 25, hgb: 25}
calibration: {method: sigmoid, cv: 3}
lr_l2: {max_iter: 2000}
lr_enet: {max_iter: 2000, tol: 0.001}
hgb: {max_iter: 300}
min_eligible: 50            # a label or subset with fewer eligible development participants is skipped

leakage_checks:
  missingness_auroc_flag: 0.70

selection:                  # docs/selection_protocol.md
  gates: {slope_min: 0.7, slope_max: 1.3}
  tolerances: {slope: 0.05, jaccard: 0.05, strict_drop: 0.01}
  simplicity: [lr_l2, lr_enet, hgb, rf, xgb]

robustness:
  n_seeds: 3
  top_k: 10
  shap_rows_per_fold: 100     # rows explained per outer-fold model (TreeSHAP on a forest is slow)

explain:
  max_rows_per_fold: 300
  top_n: 20
  dependence_bins: 10

ablation:
  modalities: [DAT, MRI, biofluid, cognition, genetics, motor, non-motor clinical, vascular evidence, demographics]
  clinical_demographics: [cognition, motor, non-motor clinical, demographics]

# sensitivity label -> the primary label whose selected model and hyperparameters it reuses
sensitivity_labels:
  pd_type_saa_v1: pd_type_v1
  ad_like_lumipulse_v1: ad_like_v1
  ad_like_v1_cut028: ad_like_v1
  ad_like_v1_cut022: ad_like_v1
  ad_like_v1_uncensored: ad_like_v1
  vascular_v2: vascular_v1

medication_record: {label: vascular_v1, column: med_record_any}

final:
  version: v1.0
  n_bootstrap: 1000
